.xc-bob{animation:xcbob 2.8s ease-in-out infinite alternate}

.xc-rove{position:absolute;bottom:6px;animation:xcrove 16s linear infinite}
@keyframes xcrove{from{left:-140px}to{left:100%}}
.xc-wheel{animation:xcspin2 1s linear infinite}

.xc-act{opacity:0;animation:xcact 12s linear infinite}

.xc-wave{animation:xcwave 2.4s linear infinite}

.xc-motion{display:none}
